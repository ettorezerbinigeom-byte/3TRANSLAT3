name: Costruisci APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Costruisci l'APK
        run: gradle assembleRelease --no-daemon

      - name: Rinomina
        run: cp app/build/outputs/apk/release/app-release.apk 3TRANSLAT3.apk

      - name: Pubblica l'APK nella pagina Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: 3TRANSLAT3 - versione 1.${{ github.run_number }}
          body: Scarica 3TRANSLAT3.apk dal telefono e installalo.
          files: 3TRANSLAT3.apk
